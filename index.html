<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link rel="icon" type="image/svg+xml" href="/eduboard-mark.svg" />
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Manrope:wght@500;600;700;800&display=swap"
            rel="stylesheet"
        />
        <meta
            name="description"
            content="EduBoard — Assignment and Review Dashboard"
        />
        <title>EduBoard — Assignment & Review Dashboard</title>
    </head>
    <body>
        <script>
            try {
                if (localStorage.getItem("eduboard_theme") === "light") {
                    document.body.classList.add("theme-light");
                }
            } catch {
                // Keep the default theme if browser storage is unavailable.
            }
        </script>
        <div id="root"></div>
        <script type="module" src="/src/main.jsx"></script>
    </body>
</html>
